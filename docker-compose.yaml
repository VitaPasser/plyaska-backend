services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
      - ./logs:/app/logs
    environment:
      MONGO_HOST: mongodb
      REDIS_HOST: redis
      LOGGING_DIR_PATH: ${MONGO_HOST}
    expose:
      - "${SERVER_INTERNAL_PORT}"
    networks:
      - mongodb-network
      - redis-network
      - haproxy-network
    depends_on:
      mongodb:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl", "--fail", "http://localhost:8000/healthcheck/", "&&", "0", "||", "exit", "1"]
      interval: 1s
      retries: 5
      start_period: 10s
      timeout: 5s

  haproxy:
    image: haproxy:latest
    container_name: haproxy_lb
    ports:
      - "8000:80"  # проброс порта на хост
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - haproxy-network
    depends_on:
      - web

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    networks:
      - mongodb-network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh", "--eval", "'db.runCommand(\"ping\").ok'", "localhost:27017/test", "--quiet"]
      interval: 1s
      retries: 5
      start_period: 10s
      timeout: 5s

  redis:
    image: redis:8.2-alpine
    container_name: pb_redis
    ports:
      - "6379:6379"
    networks:
      - redis-network
    volumes:
      - redis_data:/data/redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "--raw", "incr", "ping"]
      interval: 1s
      retries: 5
      start_period: 10s
      timeout: 5s

volumes:
  mongodb_data:
  redis_data:

networks:
  mongodb-network:
    driver: bridge
  redis-network:
    driver: bridge
  haproxy-network:
    driver: bridge